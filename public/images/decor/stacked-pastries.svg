<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" fill="none">
    <!-- Kawaii Stacked Bakery Treats (Daisy Bakery Signature Mascot Treats) -->

    <!-- 1. BOTTOM TREAT: Fluffy Custard Bun / Macaron -->
    <g id="bottom-bun">
        <!-- Bun Body -->
        <ellipse cx="50" cy="104" rx="34" ry="20" fill="#FDE4B8" stroke="#3A221B" stroke-width="2.5" />
        <ellipse cx="50" cy="98" rx="32" ry="16" fill="#FDF3DA" />
        <!-- Caramelized top glaze -->
        <path d="M22 98c4-6 16-10 28-10s24 4 28 10c-4 3-14 6-28 6s-24-3-28-6z" fill="#E8A756" opacity="0.45" />
        <!-- Kawaii Face -->
        <circle cx="42" cy="104" r="2.2" fill="#3A221B" />
        <circle cx="58" cy="104" r="2.2" fill="#3A221B" />
        <!-- Rosy Cheeks -->
        <circle cx="36" cy="107" r="3" fill="#FF8A9E" opacity="0.6" />
        <circle cx="64" cy="107" r="3" fill="#FF8A9E" opacity="0.6" />
        <!-- Happy Smile -->
        <path d="M47 106c1.5 2 4.5 2 6 0" stroke="#3A221B" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 2. MIDDLE TREAT: Sweet Strawberry Cream Cake -->
    <g id="middle-cake">
        <!-- Cake Base -->
        <rect x="22" y="54" width="56" height="32" rx="10" fill="#FFF0F3" stroke="#3A221B" stroke-width="2.5" />
        <!-- Cream & Strawberry Filling Layer -->
        <rect x="24" y="66" width="52" height="8" rx="3" fill="#FFB7C5" />
        <circle cx="34" cy="70" r="2" fill="#BE123C" />
        <circle cx="50" cy="70" r="2" fill="#BE123C" />
        <circle cx="66" cy="70" r="2" fill="#BE123C" />
        <!-- Kawaii Face -->
        <circle cx="40" cy="62" r="2.2" fill="#3A221B" />
        <circle cx="60" cy="62" r="2.2" fill="#3A221B" />
        <!-- Winking or open happy smile -->
        <path d="M47 63c1.5 2.5 4.5 2.5 6 0" stroke="#3A221B" stroke-width="2" stroke-linecap="round" />
        <!-- Rosy Cheeks -->
        <ellipse cx="33" cy="64" rx="3.5" ry="2" fill="#FF6B8B" opacity="0.6" />
        <ellipse cx="67" cy="64" rx="3.5" ry="2" fill="#FF6B8B" opacity="0.6" />
    </g>

    <!-- 3. TOP TREAT: Golden French Croissant with Butter Shine -->
    <g id="top-croissant">
        <!-- Croissant Body -->
        <path d="M20 38c-3-8 8-22 30-22s33 14 30 22c-5 6-16 2-30 2s-25 4-30-2z" fill="#F6C878" stroke="#3A221B" stroke-width="2.5" stroke-linejoin="round" />
        <!-- Croissant Flaky Flaps -->
        <path d="M34 18c3 5 5 13 4 20" stroke="#3A221B" stroke-width="2" stroke-linecap="round" />
        <path d="M66 18c-3 5-5 13-4 20" stroke="#3A221B" stroke-width="2" stroke-linecap="round" />
        <path d="M42 16c2 4 3 14 2 22" stroke="#E59E38" stroke-width="3" stroke-linecap="round" />
        <path d="M58 16c-2 4-3 14-2 22" stroke="#E59E38" stroke-width="3" stroke-linecap="round" />
        <!-- Kawaii Face on Croissant -->
        <!-- Happy Eyes (curved arcs) -->
        <path d="M43 27c1-1.5 3-1.5 4 0" stroke="#3A221B" stroke-width="2.2" stroke-linecap="round" />
        <path d="M53 27c1-1.5 3-1.5 4 0" stroke="#3A221B" stroke-width="2.2" stroke-linecap="round" />
        <!-- Little open mouth -->
        <path d="M48 30c1 1.8 3 1.8 4 0" stroke="#3A221B" stroke-width="2" stroke-linecap="round" fill="#E11D48" />
        <!-- Rosy Cheeks -->
        <circle cx="39" cy="30" r="2.5" fill="#FF8A9E" opacity="0.7" />
        <circle cx="61" cy="30" r="2.5" fill="#FF8A9E" opacity="0.7" />
        <!-- Tiny strawberry topper on croissant -->
        <path d="M50 8c-3 0-5 3-4 6 1 2 4 4 4 4s3-2 4-4c1-3-1-6-4-6z" fill="#E11D48" stroke="#3A221B" stroke-width="1.2" />
        <path d="M48 8c1-1 3-1 4 0M50 7v2" stroke="#22C55E" stroke-width="1.2" stroke-linecap="round" />
    </g>
</svg>
