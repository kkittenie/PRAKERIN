<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 115" fill="none">
    <!-- Daisy Bakery Signature Vintage Heart Celebration Cake (matching Image 1 patisserie reference) -->
    <defs>
        <!-- Soft Drop Shadow -->
        <filter id="cake-shadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#3A221B" flood-opacity="0.12" />
        </filter>

        <!-- Buttercream Gradients -->
        <linearGradient id="cake-wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFDF7" />
            <stop offset="50%" stop-color="#FBF4E4" />
            <stop offset="100%" stop-color="#EFE2CA" />
        </linearGradient>

        <linearGradient id="cake-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFDF9" />
            <stop offset="60%" stop-color="#FAF4E6" />
            <stop offset="100%" stop-color="#F3E9D2" />
        </linearGradient>

        <linearGradient id="rose-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFBCC9" />
            <stop offset="50%" stop-color="#F28DA2" />
            <stop offset="100%" stop-color="#D9637B" />
        </linearGradient>

        <linearGradient id="rose-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFCAD4" />
            <stop offset="60%" stop-color="#F69BB0" />
            <stop offset="100%" stop-color="#DE6E86" />
        </linearGradient>

        <!-- Reusable Piped Rose Rosette -->
        <g id="piped-rose">
            <ellipse cx="0" cy="0" rx="4.8" ry="4.2" fill="url(#rose-grad-1)" stroke="#8A2E44" stroke-width="0.8" />
            <!-- Inner petal swirls -->
            <path d="M-2.5 -1.2 C-2.5 -3.2, 2.5 -3.2, 2.5 -1.2 C2.5 1.5, -1.8 2.2, -0.5 -0.2 C0.2 -1.2, 1.5 -0.5, 0.8 0.8" fill="none" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.85" />
            <circle cx="0" cy="0" r="1.2" fill="#BA3650" />
        </g>

        <!-- Reusable Mini Rose -->
        <g id="mini-rose">
            <circle cx="0" cy="0" r="3.2" fill="url(#rose-grad-2)" stroke="#8A2E44" stroke-width="0.7" />
            <path d="M-1.5 -0.8 C-1.5 -2, 1.5 -2, 1.5 -0.8 C1.5 1, -1 1.2, 0 0" fill="none" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round" opacity="0.85" />
        </g>

        <!-- Reusable Sage Leaf -->
        <g id="sage-leaf">
            <path d="M0 0 C-3 -3, -4 -7, 0 -8 C4 -7, 3 -3, 0 0 Z" fill="#88B092" stroke="#486D51" stroke-width="0.7" />
            <path d="M0 0 L0 -6" stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round" opacity="0.6" />
        </g>
    </defs>

    <g filter="url(#cake-shadow)">
        <!-- 1. BASE SCALLOPED DOILY / CAKE BOARD -->
        <path d="M60 108 C30 96, 10 82, 10 65 C10 46, 26 38, 42 45 C49 48, 56 53, 60 58 C64 53, 71 48, 78 45 C94 38, 110 46, 110 65 C110 82, 90 96, 60 108 Z"
              fill="#FAF0DE" stroke="#D8C2A0" stroke-width="1.6" />

        <!-- 2. HEART CAKE BODY WALL (Vertical Extrusion ~22px) -->
        <path d="M14 55 C14 74, 34 88, 60 101 C86 88, 106 74, 106 55 L106 40 C106 59, 86 73, 60 86 C34 73, 14 59, 14 40 Z"
              fill="url(#cake-wall-grad)" stroke="#3A221B" stroke-width="1.8" stroke-linejoin="round" />

        <!-- 3. DRAPED BUTTERCREAM GARLANDS / SWAGS ON CAKE SIDES -->
        <path d="M18 50 C26 62, 38 64, 46 54 C53 64, 67 64, 74 54 C82 64, 94 62, 102 50"
              fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" filter="drop-shadow(0 1px 1px rgba(58,34,27,0.15))" />
        <path d="M26 62 C34 71, 44 72, 50 64 C56 72, 66 71, 74 62"
              fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" filter="drop-shadow(0 1px 1px rgba(58,34,27,0.15))" />

        <!-- Side Wall Hanging Roses -->
        <use href="#mini-rose" x="46" y="55" />
        <use href="#mini-rose" x="74" y="55" />
        <use href="#mini-rose" x="60" y="65" />
        <use href="#mini-rose" x="33" y="67" />
        <use href="#mini-rose" x="87" y="67" />

        <!-- 4. BOTTOM PIPED SHELL BORDER -->
        <g fill="#FFFDF8" stroke="#3A221B" stroke-width="1.4">
            <!-- Left bottom shells to center tip -->
            <path d="M14 55 c1 3 4 5 7 3 c1 3 5 4 8 2 c2 3 5 4 8 2 c2 3 6 4 9 2 c2 3 6 3 9 1 c2 2 5 2 7 0" />
            <!-- Right bottom shells to center tip -->
            <path d="M106 55 c-1 3 -4 5 -7 3 c-1 3 -5 4 -8 2 c-2 3 -5 4 -8 2 c-2 3 -6 4 -9 2 c-2 3 -6 3 -9 1 c-2 2 -5 2 -7 0" />
            <!-- Center bottom shell node -->
            <ellipse cx="60" cy="100.5" rx="4.5" ry="3.2" fill="#FFFFFF" />
        </g>

        <!-- 5. TOP SURFACE OF HEART CAKE -->
        <path d="M60 48 C55 38, 42 24, 28 26 C16 28, 12 40, 14 50 C18 64, 40 76, 60 86 C80 76, 102 64, 106 50 C108 40, 104 28, 92 26 C78 24, 65 38, 60 48 Z"
              fill="url(#cake-top-grad)" stroke="#3A221B" stroke-width="1.8" stroke-linejoin="round" />

        <!-- Center Inner Top Heart Ring Frosting (Subtle Cream Piping) -->
        <path d="M60 49 C57 42, 48 33, 38 35 C30 36, 27 44, 29 50 C32 59, 47 67, 60 74 C73 67, 88 59, 91 50 C93 44, 90 36, 82 35 C72 33, 63 42, 60 49 Z"
              fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-dasharray="2.5 2" opacity="0.9" />

        <!-- 6. TOP PIPED SHELL ROSETTE BORDER (All around the heart perimeter) -->
        <g fill="#FFFFFF" stroke="#3A221B" stroke-width="1.3">
            <!-- Left lobe shells -->
            <circle cx="53" cy="42" r="3.2" />
            <circle cx="45" cy="35" r="3.4" />
            <circle cx="36" cy="30" r="3.6" />
            <circle cx="26" cy="30" r="3.8" />
            <circle cx="18" cy="36" r="3.8" />
            <circle cx="15" cy="45" r="3.6" />
            <circle cx="18" cy="54" r="3.5" />
            <circle cx="25" cy="62" r="3.5" />
            <circle cx="34" cy="70" r="3.4" />
            <circle cx="44" cy="77" r="3.4" />
            <circle cx="53" cy="82" r="3.3" />

            <!-- Right lobe shells -->
            <circle cx="67" cy="42" r="3.2" />
            <circle cx="75" cy="35" r="3.4" />
            <circle cx="84" cy="30" r="3.6" />
            <circle cx="94" cy="30" r="3.8" />
            <circle cx="102" cy="36" r="3.8" />
            <circle cx="105" cy="45" r="3.6" />
            <circle cx="102" cy="54" r="3.5" />
            <circle cx="95" cy="62" r="3.5" />
            <circle cx="86" cy="70" r="3.4" />
            <circle cx="76" cy="77" r="3.4" />
            <circle cx="67" cy="82" r="3.3" />

            <!-- Point tip shell -->
            <circle cx="60" cy="85.5" r="3.6" />
        </g>

        <!-- 7. TOP PINK ROSES AND SAGE LEAVES (Matching Patisserie Cake in Image 1) -->
        <!-- Center top cleft roses -->
        <use href="#sage-leaf" x="60" y="44" transform="rotate(-30 60 44)" />
        <use href="#sage-leaf" x="60" y="44" transform="rotate(30 60 44)" />
        <use href="#piped-rose" x="60" y="43" />

        <!-- Left lobe cluster -->
        <use href="#sage-leaf" x="31" y="27" transform="rotate(-65 31 27)" />
        <use href="#piped-rose" x="31" y="28" />
        <use href="#mini-rose" x="25" y="32" />

        <!-- Right lobe cluster -->
        <use href="#sage-leaf" x="89" y="27" transform="rotate(65 89 27)" />
        <use href="#piped-rose" x="89" y="28" />
        <use href="#mini-rose" x="95" y="32" />

        <!-- Outer side roses -->
        <use href="#sage-leaf" x="14" y="46" transform="rotate(-90 14 46)" />
        <use href="#piped-rose" x="16" y="46" />

        <use href="#sage-leaf" x="106" y="46" transform="rotate(90 106 46)" />
        <use href="#piped-rose" x="104" y="46" />

        <!-- Lower edge roses leading to point -->
        <use href="#sage-leaf" x="37" y="69" transform="rotate(-45 37 69)" />
        <use href="#piped-rose" x="38" y="70" />

        <use href="#sage-leaf" x="83" y="69" transform="rotate(45 83 69)" />
        <use href="#piped-rose" x="82" y="70" />

        <!-- Bottom tip rose -->
        <use href="#sage-leaf" x="60" y="85" transform="rotate(180 60 85)" />
        <use href="#piped-rose" x="60" y="86" />

        <!-- Delicate silk ribbon bow on front cleft (Signature patisserie detail) -->
        <g id="front-ribbon" filter="drop-shadow(0 1px 2px rgba(58,34,27,0.2))">
            <!-- Left loop -->
            <path d="M60 52 C54 47, 47 47, 47 52 C47 57, 55 56, 60 53 Z" fill="#FFAEC0" stroke="#8A2E44" stroke-width="0.8" />
            <!-- Right loop -->
            <path d="M60 52 C66 47, 73 47, 73 52 C73 57, 65 56, 60 53 Z" fill="#FFAEC0" stroke="#8A2E44" stroke-width="0.8" />
            <!-- Center knot -->
            <circle cx="60" cy="52.5" r="1.8" fill="#F2738E" stroke="#8A2E44" stroke-width="0.8" />
            <!-- Tails -->
            <path d="M59 54 C56 59, 52 63, 49 65" stroke="#FFAEC0" stroke-width="1.6" stroke-linecap="round" />
            <path d="M61 54 C64 59, 68 63, 71 65" stroke="#FFAEC0" stroke-width="1.6" stroke-linecap="round" />
        </g>
    </g>
</svg>